name: converter-ai

on:
  push:
    paths:
      - "converter-ai/**"
      - ".github/workflows/converter-ai.yml"
  pull_request:
    paths:
      - "converter-ai/**"
      - ".github/workflows/converter-ai.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: converter-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: converter-ai/package-lock.json

  # Opt-in static preview: a commit whose message contains [preview] gets the
  # exported site committed back as preview-out/ so it can be shared privately.
  preview:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[preview]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export
        working-directory: converter-ai
        run: |
          npm install --no-audit --no-fund
          STATIC_EXPORT=1 npm run build
      - name: Commit export
        run: |
          rm -rf preview-out && cp -r converter-ai/out preview-out
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f preview-out
          git commit -m "Static preview export (temporary)"
          git push origin HEAD:${{ github.ref_name }}
