name: converter-ai

on:
  push:
    paths:
      - "converter-ai/**"
      - ".github/workflows/converter-ai.yml"
  pull_request:
    paths:
      - "converter-ai/**"
      - ".github/workflows/converter-ai.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: converter-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: converter-ai/package-lock.json
